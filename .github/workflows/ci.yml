# CI 快速门禁 — 每次 push / pull_request 触发
#
# 设计目标: 在 ~5 分钟内给出 PR 是否可合并的信号。按成本/风险分两个 job:
#   1. guard      — 纯源码扫描的架构守护，编译前先跑（最快反馈，~30s）
#   2. build-test — Debug 库/第一方示例构建 + 分层 CTest 硬门禁
#
# job 间解耦: guard 不依赖编译产物，即使 build-test 挂了 guard 的结果仍可见，
# 便于快速定位是架构问题还是代码问题。build-test 内编译一次，先跑绿色门禁
# （阻断），再跑完整 unit 分区，避免重复编译。显式启用 examples，确保 public API
# 收缩时第一方加载器、集成示例和批量验证目标同步迁移。
#
# 平台: 仅 macOS（macos-14, arm64）。Windows conan 路径 JSBSim 来源待核实，留后续。
# 详见 docs/practice/ci.md。
#
# 本地复现（见 docs/practice/ci.md "本地复现" 一节）:
#   bash scripts/bootstrap_conan.sh llvm-ninja-debug
#   cmake --preset llvm-ninja-debug -D ENABLE_EXAMPLES=ON
#   cmake --build --preset llvm-ninja-debug
#   ctest --test-dir build/llvm-ninja-debug -L contract --output-on-failure -j4
#   ctest --test-dir build/llvm-ninja-debug -L ci_required --output-on-failure -j4
#   ctest --test-dir build/llvm-ninja-debug -L unit --output-on-failure -j4

name: CI

on:
  push:
    branches: [main, codex/optimize]
  pull_request:
    branches: [main]
  workflow_dispatch: # 允许手动触发，便于调试

# 同一分支新提交时取消旧的运行，节省 runner 资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Conan 缓存 key 基于此文件的依赖清单哈希；改动 conanfile.py 会自动重建缓存
  CONAN_CACHE_KEY: ${{ hashFiles('conanfile.py') }}
  PRESET: llvm-ninja-debug

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Job 1: guard — 架构守护，编译前先跑（最快反馈）
  # 跑 -L contract: live CTest inventory 中的 script guards + compiled contract partitions
  # 这些检查只读源码，不依赖编译产物，是项目"可执行架构规则"的核心。
  # ─────────────────────────────────────────────────────────────────────
  guard:
    name: Guard (contract)
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 编码守卫：全部 git 追踪的 C/C++ 源文件必须为 UTF-8 with BOM
      # （VS2015 集成端按 GBK 误读无 BOM 文件，中文注释错位截断）。
      # 零依赖秒级检查，先于 Conan/CMake 反馈。
      - name: Source encoding guard (UTF-8 BOM)
        run: python3 scripts/utf8_bom.py check

      - name: Install Conan 2.x
        run: pip install conan

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ env.CONAN_CACHE_KEY }}-debug

      - name: Bootstrap Conan (generate toolchain)
        run: bash scripts/bootstrap_conan.sh ${{ env.PRESET }}

      - name: Configure
        run: cmake --preset ${{ env.PRESET }}

      - name: Run contract guards
        run: ctest --test-dir build/llvm-ninja-debug -L contract --output-on-failure -j 4

  # ─────────────────────────────────────────────────────────────────────
  # Job 2: build-test — Debug 库/第一方示例构建 + 测试门禁
  # 编译一次，分两轮跑测试:
  #   (a) 通用快速门禁: ci_required（replay/integration/public API/SAR guards）
  #   (b) 全量 unit 分区；两轮任一失败均阻断 PR。
  # ─────────────────────────────────────────────────────────────────────
  build-test:
    name: Build & Test
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Conan 2.x
        run: pip install conan

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ env.CONAN_CACHE_KEY }}-debug

      - name: Bootstrap Conan (generate toolchain)
        run: bash scripts/bootstrap_conan.sh ${{ env.PRESET }}

      - name: Configure
        run: cmake --preset ${{ env.PRESET }} -D ENABLE_EXAMPLES=ON

      - name: Build
        run: cmake --build --preset ${{ env.PRESET }} -j 4

      - name: Verify installed package consumer
        run: |
          cmake --install build/llvm-ninja-debug
          cmake -S tests/consumer -B build/consumer/llvm-ninja-debug -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_TOOLCHAIN_FILE=$PWD/build/llvm-ninja-debug/build/Debug/generators/conan_toolchain.cmake \
                -DCMAKE_PREFIX_PATH=$PWD/build/install/llvm-ninja-debug
          cmake --build build/consumer/llvm-ninja-debug -j 4
          find build/consumer/llvm-ninja-debug -maxdepth 1 -type f -perm -111 \
               -exec {} \;

      # ── (a) 通用绿色硬门禁: 失败则整个 job 失败 ──
      - name: Run green-label tests (blocking)
        run: |
          ctest --test-dir build/llvm-ninja-debug \
                -L ci_required \
                --output-on-failure -j 4

      # ── (b) 全量 unit 分区：稳定的细粒度回归门禁 ──
      - name: Run unit partitions (blocking)
        run: |
          ctest --test-dir build/llvm-ninja-debug \
                -L unit \
                --output-on-failure -j 4
